<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc"><title id="title">C4 context static preview</title><desc id="desc">Free PHP assessment platform receives scoped answers and staff configuration,returns authorized reports and uses email;optional AI deferred.</desc><style>text{font-family:Segoe UI,Arial,sans-serif} .bold{font-weight:600}</style><rect width="1280" height="880" fill="#F5F7F6"/><text x="40" y="45" font-size="18" fill="#006B5E" font-weight="700">WAYPOINT / Assessment &amp; planning</text><text x="1240" y="45" font-size="14" fill="#526260" text-anchor="end">Free to use · Documentation mockup</text><line x1="40" y1="70" x2="1240" y2="70" stroke="#D6DEDB"/><text x="80" y="130" font-size="32" fill="#172B2A" font-weight="600">System context / Proposed design</text><rect x="60" y="270" width="300" height="200" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><text x="84" y="320" font-size="28" fill="#172B2A" >Run owner</text><text x="84" y="363" font-size="18" fill="#172B2A" >Founder / software sponsor</text><text x="84" y="402" font-size="17" fill="#172B2A" >Answers, review, scenarios</text><rect x="490" y="250" width="340" height="250" rx="12" fill="#E5F2EE" stroke="#006B5E"/><text x="514" y="307" font-size="27" fill="#006B5E" font-weight="600">Assessment platform</text><text x="514" y="350" font-size="22" fill="#172B2A" >PHP · Free access</text><text x="514" y="394" font-size="17" fill="#172B2A" >Scoped sessions and reports</text><text x="514" y="435" font-size="20" fill="#172B2A" >No payments</text><rect x="960" y="270" width="260" height="200" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><text x="984" y="320" font-size="27" fill="#172B2A" >Staff roles</text><text x="984" y="363" font-size="17" fill="#172B2A" >Author / review / publish</text><text x="984" y="402" font-size="17" fill="#172B2A" >MFA + least privilege</text><path d="M360 340H490 M490 410H360 M960 340H830" stroke="#172B2A" stroke-width="2"/><text x="375" y="326" font-size="14" fill="#172B2A" >HTTPS</text><text x="365" y="445" font-size="14" fill="#172B2A" >Reports</text><text x="840" y="326" font-size="14" fill="#172B2A" >Config</text><rect x="40" y="756" width="1200" height="96" rx="8" fill="#E5F2EE" stroke="#D6DEDB"/><text x="60" y="782" font-size="15" fill="#172B2A" >C4 context scope: people and platform boundary; container details in c4-containers.mmd.</text><text x="60" y="809" font-size="15" fill="#172B2A" >Relationships exact and authored as vector; not an AI-generated architecture image.</text><text x="60" y="836" font-size="15" fill="#172B2A" >Optional narrative AI is deferred; email notifications do not carry raw answers.</text><path d="M480 335 L490 340 L480 345 M370 405 L360 410 L370 415 M840 335 L830 340 L840 345 M660 500 L660 548 M655 538 L660 548 L665 538" fill="none" stroke="#172B2A" stroke-width="2"/><rect x="490" y="548" width="340" height="132" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><text x="514" y="589" font-size="24" fill="#172B2A" font-weight="600">Email service</text><text x="514" y="625" font-size="16" fill="#526260">Transactional notifications</text><text x="514" y="655" font-size="15" fill="#526260">No raw assessment answers</text></svg>