  "components": {
    "securitySchemes": {
      "SessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "assessment_session",
        "description": "Secure HttpOnly SameSite session; CSRF+Origin required for mutations; anonymous principals own isolated projects."
      }
    },
    "parameters": {
      "runId": {
        "name": "runId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "reportId": {
        "name": "reportId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "estimateId": {
        "name": "estimateId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "operationId": {
        "name": "operationId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "draftId": {
        "name": "draftId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "exportId": {
        "name": "exportId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "Idempotency": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 16,
          "maxLength": 128
        },
        "description": "Principal/project/endpoint scoped; same key and different body ->409. Proposed replay retention24h; live auth always checked."
      },
      "IfMatch": {
        "name": "If-Match",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^\"[0-9]+\"$"
        },
        "description": "Strong aggregate revision ETag"
      },
      "Csrf": {
        "name": "X-CSRF-Token",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 16
        },
        "description": "Server issued, bound to cookie session; validated with Origin"
      },
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "schema": {
          "type": "string",
          "maxLength": 512
        }
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        }
      }
    },
    "schemas": {
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "title",
          "status",
          "code",
          "correlationId"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri-reference"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "code": {
            "type": "string"
          },
          "detail": {
            "type": "string"
          },
          "correlationId": {
            "type": "string",
            "format": "uuid"
          },
          "errors": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "path",
                "code"
              ],
              "properties": {
                "path": {
                  "type": "string"
                },
                "code": {
                  "type": "string"
                },
                "message": {
                  "type": "string"
                }
              }
            }
          }
        }
      },
      "Answer": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "questionId",
          "state"
        ],
        "properties": {
          "questionId": {
            "type": "string",
            "pattern": "^Q-[A-Z0-9-]+$"
          },
          "state": {
            "enum": [
              "known",
              "unknown",
              "not_decided",
              "not_applicable"
            ]
          },
          "value": {
            "type": [
              "string",
              "number",
              "integer",
              "boolean",
              "object",
              "array"
            ]
          },
          "notApplicableReason": {
            "type": "string",
            "maxLength": 500
          },
          "provenance": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "sourceRunId",
              "sourceQuestionId",
              "sourceRevision",
              "confirmedAt"
            ],
            "properties": {
              "sourceRunId": {
                "type": "string",
                "format": "uuid"
              },
              "sourceQuestionId": {
                "type": "string"
              },
              "sourceRevision": {
                "type": "integer",
                "minimum": 1
              },
              "confirmedAt": {
                "type": "string",
                "format": "date-time"
              }
            }
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "state": {
                  "const": "known"
                }
              }
            },
            "then": {
              "required": [
                "value"
              ]
            },
            "else": {
              "not": {
                "required": [
                  "value"
                ]
              }
            }
          },
          {
            "if": {
              "properties": {
                "state": {
                  "const": "not_applicable"
                }
              }
            },
            "then": {
              "required": [
                "notApplicableReason"
              ]
            }
          }
        ],
        "description": "Wire camelCase maps to bank snake_case: questionId -> question_id; notApplicableReason -> not_applicable_reason. Value must additionally conform to pinned question field schema. Client cannot set inactive; server derives applicability."
      },
      "AnswerSet": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "answers"
        ],
        "properties": {
          "answers": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/Answer"
            }
          }
        }
      },
      "Flow": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "key",
          "releaseId",
          "name",
          "availableLocales"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "key": {
            "pattern": "^[a-zA-Z0-9_-]{1,80}$"
          },
          "releaseId": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "availableLocales": {
            "type": "array",
            "uniqueItems": true,
            "items": {
              "type": "string"
            }
          }
        }
      },
      "Run": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "projectId",
          "flowReleaseId",
          "revision",
          "status",
          "locale",
          "answers",
          "conflicts"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "projectId": {
            "type": "string",
            "format": "uuid"
          },
          "flowReleaseId": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "status": {
            "enum": [
              "active",
              "paused",
              "reviewable",
              "completed",
              "suspended",
              "expired",
              "deleted"
            ]
          },
          "locale": {
            "type": "string"
          },
          "answers": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Answer"
            }
          },
          "nextQuestionId": {
            "type": [
              "string",
              "null"
            ]
          },
          "conflicts": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "code",
                "questionIds"
              ],
              "properties": {
                "code": {
                  "type": "string"
                },
                "questionIds": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                },
                "message": {
                  "type": "string"
                }
              }
            }
          },
          "inactiveQuestionIds": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "CreateRun": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "flowId",
          "locale"
        ],
        "properties": {
          "flowId": {
            "type": "string",
            "format": "uuid"
          },
          "locale": {
            "type": "string",
            "maxLength": 64
          },
          "projectId": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "Operation": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "status",
          "kind",
          "pollAfterSeconds"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "enum": [
              "queued",
              "running",
              "complete",
              "failed",
              "cancelled"
            ]
          },
          "kind": {
            "enum": [
              "report",
              "export",
              "reprice",
              "publish",
              "privacy_export"
            ]
          },
          "pollAfterSeconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 300
          },
          "resultUrl": {
            "type": "string",
            "format": "uri-reference"
          },
          "error": {
            "$ref": "#/components/schemas/Problem"
          }
        }
      },
      "Money": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "currency",
          "exponent",
          "amountMinor"
        ],
        "properties": {
          "currency": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "exponent": {
            "type": "integer",
            "minimum": 0,
            "maximum": 6
          },
          "amountMinor": {
            "type": "string",
            "pattern": "^-?[0-9]+$"
          }
        }
      },
      "Evidence": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "answerIds",
          "ruleIds",
          "assumptionIds"
        ],
        "properties": {
          "answerIds": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "ruleIds": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "assumptionIds": {
            "type": "array",
            "items": {
              "type": "string"
            }
