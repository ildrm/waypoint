<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc"><title id="title">UI-08 Admin flow editor,desktop LTR</title><desc id="desc">Draft branching editor with move controls,typed rule summary,validation and published read-only context.</desc><style>text{font-family:Segoe UI,Arial,sans-serif} .bold{font-weight:600}</style><rect width="1280" height="880" fill="#F5F7F6"/><text x="40" y="45" font-size="18" fill="#006B5E" font-weight="700">WAYPOINT / Assessment &amp; planning</text><text x="1240" y="45" font-size="14" fill="#526260" text-anchor="end">Free to use · Documentation mockup</text><line x1="40" y1="70" x2="1240" y2="70" stroke="#D6DEDB"/><text x="40" y="122" font-size="14" fill="#526260" >CONTENT</text><text x="40" y="166" font-size="17" fill="#006B5E" >Flows</text><text x="40" y="214" font-size="17" fill="#526260" >Questions</text><text x="40" y="262" font-size="17" fill="#526260" >Rules</text><text x="40" y="310" font-size="17" fill="#526260" >Catalog</text><text x="40" y="358" font-size="17" fill="#526260" >Translations</text><text x="40" y="406" font-size="17" fill="#526260" >Estimate pricing</text><text x="40" y="454" font-size="17" fill="#526260" >Releases</text><rect x="240" y="98" width="960" height="594" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><text x="272" y="140" font-size="30" fill="#172B2A" font-weight="600">Software discovery / Draft 7</text><text x="272" y="180" font-size="16" fill="#526260" >Based on release 6 · Changes require validation and review</text><rect x="272" y="210" width="280" height="346" rx="8" fill="#F5F7F6" stroke="#D6DEDB"/><text x="292" y="246" font-size="21" fill="#172B2A" >Delivery surfaces</text><text x="292" y="292" font-size="14" fill="#172B2A" >Q-SW-SURFACES</text><text x="292" y="340" font-size="14" fill="#172B2A" >Q-SW-MOBILE-PLATFORMS</text><text x="292" y="388" font-size="14" fill="#172B2A" >Q-SW-OFFLINE</text><text x="292" y="436" font-size="14" fill="#172B2A" >Q-SW-DEVICE-FEATURES</text><text x="292" y="520" font-size="15" fill="#006B5E" >Move up / Move down</text><text x="588" y="244" font-size="24" fill="#172B2A" font-weight="600">Q-SW-OFFLINE</text><text x="588" y="287" font-size="17" fill="#172B2A" >Type: structured record</text><text x="588" y="331" font-size="17" fill="#172B2A" >Visible when surfaces contains mobile</text><text x="588" y="375" font-size="16" fill="#172B2A" >Required: mode, tasks, hours, conflict policy</text><rect x="588" y="408" width="580" height="110" rx="8" fill="#FFF5DC" stroke="#775100"/><text x="608" y="442" font-size="21" fill="#775100" font-weight="600">Publication blocked</text><text x="608" y="477" font-size="16" fill="#775100" >2 stale critical translations need review.</text><rect x="588" y="562" width="240" height="48" rx="8" fill="#006B5E" stroke="#006B5E"/><text x="608" y="592" font-size="16" fill="#FFFFFF" font-weight="600">Simulate draft</text><text x="856" y="593" font-size="17" fill="#006B5E" >Request review</text><rect x="40" y="756" width="1200" height="96" rx="8" fill="#E5F2EE" stroke="#D6DEDB"/><text x="60" y="782" font-size="15" fill="#172B2A" >1  Stable IDs and typed restricted rules; no arbitrary executable expressions.</text><text x="60" y="809" font-size="15" fill="#172B2A" >2  Move buttons provide keyboard/non-drag alternative; published release read-only.</text><text x="60" y="836" font-size="15" fill="#172B2A" >3  Reviewer approval binds exact diff; translation/price/schema errors block release.</text></svg>
