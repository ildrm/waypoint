<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc"><title id="title">UI-04 Answer review,mobile LTR</title><desc id="desc">390px mobile content frame with unknown rate and removed mobile scope;annotations outside device.</desc><style>text{font-family:Segoe UI,Arial,sans-serif} .bold{font-weight:600}</style><rect width="1280" height="880" fill="#F5F7F6"/><text x="40" y="45" font-size="18" fill="#006B5E" font-weight="700">WAYPOINT / Assessment &amp; planning</text><text x="1240" y="45" font-size="14" fill="#526260" text-anchor="end">Free to use · Documentation mockup</text><line x1="40" y1="70" x2="1240" y2="70" stroke="#D6DEDB"/><rect x="90" y="96" width="390" height="642" rx="20" fill="#FFFFFF" stroke="#748582"/><text x="114" y="135" font-size="25" fill="#172B2A" font-weight="600">Review your answers</text><text x="114" y="170" font-size="15" fill="#526260" >Software scope · Saved</text><rect x="114" y="194" width="342" height="92" rx="8" fill="#E5F2EE" stroke="#D6DEDB"/><text x="130" y="225" font-size="20" fill="#172B2A" >Website only</text><text x="130" y="255" font-size="14" fill="#526260" >Mobile removed from this revision</text><text x="114" y="326" font-size="16" fill="#526260" >Content pages</text><text x="114" y="356" font-size="20" fill="#172B2A" >12 pages · 3 content types</text><text x="430" y="326" font-size="16" fill="#006B5E" text-anchor="end">Edit</text><text x="114" y="410" font-size="16" fill="#526260" >Peak demand</text><text x="114" y="440" font-size="20" fill="#172B2A" >20 requests / second</text><text x="430" y="410" font-size="16" fill="#006B5E" text-anchor="end">Edit</text><rect x="114" y="474" width="342" height="106" rx="8" fill="#FFF5DC" stroke="#775100"/><text x="130" y="504" font-size="18" fill="#775100" font-weight="600">One item needs review</text><text x="130" y="533" font-size="15" fill="#775100" >Hosting region is not decided.</text><text x="130" y="559" font-size="14" fill="#775100" >Result will show this assumption.</text><rect x="114" y="610" width="342" height="48" rx="8" fill="#006B5E" stroke="#006B5E"/><text x="134" y="640" font-size="16" fill="#FFFFFF" font-weight="600">Generate preliminary result</text><text x="114" y="695" font-size="14" fill="#526260" >Free assessment · No payment</text><text x="560" y="170" font-size="30" fill="#172B2A" font-weight="600">Mobile review rules</text><text x="560" y="228" font-size="19" fill="#172B2A" >1  390 px frame with 16 px inner spacing.</text><text x="560" y="274" font-size="19" fill="#172B2A" >2  Edit links name their question in semantics.</text><text x="560" y="320" font-size="19" fill="#172B2A" >3  Unknown context remains visible at review.</text><text x="560" y="366" font-size="19" fill="#172B2A" >4  Removed mobile scope cannot add app charges.</text><text x="560" y="412" font-size="19" fill="#172B2A" >5  Primary action stays in normal document flow.</text><rect x="40" y="756" width="1200" height="96" rx="8" fill="#E5F2EE" stroke="#D6DEDB"/><text x="60" y="782" font-size="15" fill="#172B2A" >UI-04 · At 320 CSS px content wraps; no fixed-height text in production.</text><text x="60" y="809" font-size="15" fill="#172B2A" >Review acknowledgement freezes an input revision, not a contract or purchase.</text><text x="60" y="836" font-size="15" fill="#172B2A" >Conflict state offers saved/local comparison; no silent overwrite.</text></svg>
