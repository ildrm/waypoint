<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc"><title id="title">UI-02 Question with clarification,desktop LTR</title><desc id="desc">Mobile device requirements selected with precise offline follow-up and save status.</desc><style>text{font-family:Segoe UI,Arial,sans-serif} .bold{font-weight:600}</style><rect width="1280" height="880" fill="#F5F7F6"/><text x="40" y="45" font-size="18" fill="#006B5E" font-weight="700">WAYPOINT / Assessment &amp; planning</text><text x="1240" y="45" font-size="14" fill="#526260" text-anchor="end">Free to use · Documentation mockup</text><line x1="40" y1="70" x2="1240" y2="70" stroke="#D6DEDB"/><text x="80" y="122" font-size="16" fill="#526260" >Software project / Delivery surfaces</text><text x="80" y="169" font-size="32" fill="#172B2A" font-weight="700">What must work without a connection?</text><text x="80" y="205" font-size="18" fill="#526260" >Select the tasks users must complete while offline.</text><rect x="80" y="238" width="700" height="76" rx="12" fill="#E5F2EE" stroke="#006B5E"/><rect x="104" y="264" width="18" height="18" rx="3" fill="#006B5E" stroke="#006B5E" stroke-width="2"/><path d="M108 273 L112 277 L119 269" fill="none" stroke="#FFFFFF" stroke-width="2"/><text x="140" y="281" font-size="20" fill="#172B2A" >Capture inspection notes and photos</text><rect x="80" y="330" width="700" height="76" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><rect x="104" y="356" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#748582" stroke-width="2"/><text x="140" y="373" font-size="20" fill="#172B2A" >Browse previously downloaded records</text><rect x="80" y="422" width="700" height="76" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><rect x="104" y="448" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#748582" stroke-width="2"/><text x="140" y="465" font-size="20" fill="#172B2A" >No offline work is required</text><rect x="824" y="238" width="376" height="288" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><text x="848" y="275" font-size="23" fill="#172B2A" font-weight="600">Clarify the requirement</text><text x="848" y="314" font-size="16" fill="#172B2A" >Longest offline period</text><rect x="848" y="330" width="328" height="48" rx="8" fill="#FFFFFF" stroke="#748582"/><text x="864" y="361" font-size="18" fill="#172B2A" >8 hours</text><text x="848" y="415" font-size="16" fill="#172B2A" >Conflicting updates</text><text x="848" y="446" font-size="16" fill="#526260" >Ask user to review before sync.</text><text x="848" y="489" font-size="15" fill="#526260" >Why this matters: sync and QA effort.</text><text x="80" y="550" font-size="18" fill="#006B5E" >I do not know yet</text><text x="80" y="600" font-size="15" fill="#526260" >Saved at 10:42 · Only acknowledged changes are saved</text><text x="80" y="663" font-size="18" fill="#006B5E" >Back</text><rect x="562" y="630" width="218" height="48" rx="8" fill="#006B5E" stroke="#006B5E"/><text x="582" y="660" font-size="16" fill="#FFFFFF" font-weight="600">Next</text><rect x="40" y="756" width="1200" height="96" rx="8" fill="#E5F2EE" stroke="#D6DEDB"/><text x="60" y="782" font-size="15" fill="#172B2A" >1  Compatible needs use checkboxes;“none” is exclusive and checked server-side.</text><text x="60" y="809" font-size="15" fill="#172B2A" >2  Detail has a named unit and explicit conflict policy; unknown stays unknown.</text><text x="60" y="836" font-size="15" fill="#172B2A" >3  Help rail moves inline on narrow screens; focus follows logical reading order.</text></svg>
