<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc"><title id="title">UI-05 Result and estimate,desktop LTR</title><desc id="desc">Exact illustrative USD18392 build price with320 hours,8 week plan and5 unique contributors;no platform charge.</desc><style>text{font-family:Segoe UI,Arial,sans-serif} .bold{font-weight:600}</style><rect width="1280" height="880" fill="#F5F7F6"/><text x="40" y="45" font-size="18" fill="#006B5E" font-weight="700">WAYPOINT / Assessment &amp; planning</text><text x="1240" y="45" font-size="14" fill="#526260" text-anchor="end">Free to use · Documentation mockup</text><line x1="40" y1="70" x2="1240" y2="70" stroke="#D6DEDB"/><text x="80" y="126" font-size="34" fill="#172B2A" font-weight="700">Your preliminary project plan</text><text x="80" y="166" font-size="17" fill="#526260" >Content website · Based on revision 3 · Hypothetical example rates</text><rect x="80" y="204" width="268" height="104" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><text x="100" y="247" font-size="28" fill="#172B2A" font-weight="600">320 hours</text><text x="100" y="282" font-size="15" fill="#526260" >Base effort</text><rect x="366" y="204" width="268" height="104" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><text x="386" y="247" font-size="28" fill="#172B2A" font-weight="600">8 weeks</text><text x="386" y="282" font-size="15" fill="#526260" >Dependency plan</text><rect x="652" y="204" width="268" height="104" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><text x="672" y="247" font-size="28" fill="#172B2A" font-weight="600">5 people</text><text x="672" y="282" font-size="15" fill="#526260" >Distinct contributors</text><rect x="938" y="204" width="268" height="104" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><text x="958" y="247" font-size="28" fill="#172B2A" font-weight="600">USD 18,392</text><text x="958" y="282" font-size="15" fill="#526260" >Build estimate</text><rect x="80" y="340" width="700" height="330" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><text x="104" y="381" font-size="25" fill="#172B2A" font-weight="600">One-time estimate</text><text x="104" y="433" font-size="17" fill="#172B2A" >Role-based work</text><text x="754" y="433" font-size="19" fill="#172B2A" text-anchor="end">17,600.00</text><text x="104" y="487" font-size="17" fill="#172B2A" >Contingency 10%</text><text x="754" y="487" font-size="19" fill="#172B2A" text-anchor="end">1,760.00</text><text x="104" y="541" font-size="17" fill="#172B2A" >Discount 5% on 19,360</text><text x="754" y="541" font-size="19" fill="#172B2A" text-anchor="end">−968.00</text><text x="104" y="595" font-size="17" fill="#172B2A" >Total excluding unconfigured taxes</text><text x="754" y="595" font-size="19" fill="#172B2A" text-anchor="end">18,392.00</text><rect x="812" y="340" width="388" height="330" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><text x="836" y="381" font-size="25" fill="#172B2A" font-weight="600">Why this solution?</text><text x="836" y="425" font-size="17" fill="#172B2A" >Standard CMS with editorial roles</text><text x="836" y="460" font-size="17" fill="#172B2A" >12 pages · 3 content types</text><text x="836" y="495" font-size="14" fill="#526260" >Q-SW-CONTENT / Q-SW-IDENTITY</text><text x="836" y="538" font-size="17" fill="#006B5E" >Alternatives and evidence</text><text x="836" y="576" font-size="18" fill="#172B2A" >Recurring: USD 350/month</text><text x="836" y="612" font-size="15" fill="#775100" >Validate hosting region and content.</text><rect x="40" y="756" width="1200" height="96" rx="8" fill="#E5F2EE" stroke="#D6DEDB"/><text x="60" y="782" font-size="15" fill="#172B2A" >1  Customer-project price is informational. The assessment platform is free.</text><text x="60" y="809" font-size="15" fill="#172B2A" >2  WBS, price book, validity, assumptions and alternatives remain inspectable.</text><text x="60" y="836" font-size="15" fill="#172B2A" >3  Partial/missing prices show “incomplete”, never a fabricated zero total.</text></svg>
