<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc"><title id="title">UI-09/10 Translation and estimate pricing,desktop RTL</title><desc id="desc">Persian illustrative RTL admin content with isolated Latin IDs and exact price row;translation unreviewed.</desc><style>text{font-family:Segoe UI,Arial,sans-serif} .bold{font-weight:600}</style><rect width="1280" height="880" fill="#F5F7F6"/><text x="40" y="45" font-size="18" fill="#006B5E" font-weight="700">WAYPOINT / Assessment &amp; planning</text><text x="1240" y="45" font-size="14" fill="#526260" text-anchor="end">Free to use · Documentation mockup</text><line x1="40" y1="70" x2="1240" y2="70" stroke="#D6DEDB"/><text x="1200" y="126" font-size="32" fill="#172B2A" text-anchor="start" direction="rtl">مدیریت ترجمه و برآورد</text><text x="1200" y="170" font-size="19" fill="#526260" text-anchor="start" direction="rtl">فارسی · نسخه پیشنهادی</text><rect x="80" y="210" width="1120" height="250" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><text x="1176" y="250" font-size="24" fill="#172B2A" text-anchor="start" direction="rtl">وضعیت ترجمه</text><text x="104" y="250" font-size="15" fill="#526260" >Source hash: e7a1 / Example only</text><text x="104" y="304" font-size="17" fill="#172B2A" >q.sw.offline.wording</text><text x="1176" y="304" font-size="18" fill="#775100" text-anchor="start" direction="rtl">نیاز به بازبینی</text><text x="104" y="358" font-size="17" fill="#172B2A" >q.sw.confirm.wording</text><text x="1176" y="358" font-size="18" fill="#526260" text-anchor="start" direction="rtl">پیش‌نویس</text><text x="104" y="412" font-size="17" fill="#172B2A" >result.price.disclaimer</text><text x="1176" y="412" font-size="18" fill="#526260" text-anchor="start" direction="rtl">پیش‌نویس</text><rect x="80" y="490" width="1120" height="206" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><text x="1176" y="532" font-size="24" fill="#172B2A" text-anchor="start" direction="rtl">نرخ‌های برآورد پروژه</text><text x="104" y="578" font-size="20" fill="#172B2A" >PB-EXAMPLE-v1   ·   DEV   ·   USD 60.00 / hour</text><text x="1176" y="578" font-size="18" fill="#526260" text-anchor="start" direction="rtl">نمونه فرضی</text><text x="104" y="630" font-size="17" fill="#006B5E" >No platform payments · Old estimates retain original price book</text><rect x="40" y="756" width="1200" height="96" rx="8" fill="#E5F2EE" stroke="#D6DEDB"/><text x="60" y="782" font-size="15" fill="#172B2A" >1  RTL structure uses logical start/end; Latin IDs, amounts and currency stay isolated LTR.</text><text x="60" y="809" font-size="15" fill="#172B2A" >2  Persian labels are illustrative and unreviewed; none is linguistic approval.</text><text x="60" y="836" font-size="15" fill="#172B2A" >3 14 named languages required; source changes mark translation stale and block critical copy.</text></svg>
