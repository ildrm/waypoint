<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc"><title id="title">UI-01 Flow choice,desktop LTR</title><desc id="desc">Choose startup,software or service guidance;free use and saved-session route;annotations show responsive rules.</desc><style>text{font-family:Segoe UI,Arial,sans-serif} .bold{font-weight:600}</style><rect width="1280" height="880" fill="#F5F7F6"/><text x="40" y="45" font-size="18" fill="#006B5E" font-weight="700">WAYPOINT / Assessment &amp; planning</text><text x="1240" y="45" font-size="14" fill="#526260" text-anchor="end">Free to use · Documentation mockup</text><line x1="40" y1="70" x2="1240" y2="70" stroke="#D6DEDB"/><text x="80" y="142" font-size="40" fill="#172B2A" font-weight="700">Choose your next useful step</text><text x="80" y="181" font-size="20" fill="#526260" >A clear assessment, with reasons and room for uncertainty.</text><rect x="80" y="232" width="364" height="330" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><rect x="104" y="256" width="48" height="48" rx="24" fill="#E5F2EE" stroke="#E5F2EE"/><text x="120" y="287" font-size="20" fill="#006B5E" >1</text><text x="104" y="350" font-size="25" fill="#172B2A" font-weight="600">Startup journey</text><text x="104" y="395" font-size="16" fill="#526260" >Find your strongest evidence gaps.</text><text x="104" y="435" font-size="15" fill="#526260" >15 stages · adaptive questions</text><rect x="104" y="484" width="316" height="48" rx="8" fill="#006B5E" stroke="#006B5E"/><text x="124" y="514" font-size="16" fill="#FFFFFF" font-weight="600">Start startup</text><rect x="468" y="232" width="364" height="330" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><rect x="492" y="256" width="48" height="48" rx="24" fill="#E5F2EE" stroke="#E5F2EE"/><text x="508" y="287" font-size="20" fill="#006B5E" >2</text><text x="492" y="350" font-size="25" fill="#172B2A" font-weight="600">Software project</text><text x="492" y="395" font-size="16" fill="#526260" >Define scope, cost, time and team.</text><text x="492" y="435" font-size="15" fill="#526260" >Web, mobile and integrations</text><rect x="492" y="484" width="316" height="48" rx="8" fill="#006B5E" stroke="#006B5E"/><text x="512" y="514" font-size="16" fill="#FFFFFF" font-weight="600">Start software</text><rect x="856" y="232" width="364" height="330" rx="12" fill="#FFFFFF" stroke="#D6DEDB"/><rect x="880" y="256" width="48" height="48" rx="24" fill="#E5F2EE" stroke="#E5F2EE"/><text x="896" y="287" font-size="20" fill="#006B5E" >3</text><text x="880" y="350" font-size="25" fill="#172B2A" font-weight="600">Find suitable help</text><text x="880" y="395" font-size="16" fill="#526260" >Compare eligible services.</text><text x="880" y="435" font-size="15" fill="#526260" >Explained matches or no match</text><rect x="880" y="484" width="316" height="48" rx="8" fill="#006B5E" stroke="#006B5E"/><text x="900" y="514" font-size="16" fill="#FFFFFF" font-weight="600">Explore options</text><text x="80" y="618" font-size="18" fill="#006B5E" >Already started? Resume a saved assessment</text><text x="80" y="664" font-size="16" fill="#526260" >Language: English   ·   14 supported languages   ·   Privacy and help</text><rect x="40" y="756" width="1200" height="96" rx="8" fill="#E5F2EE" stroke="#D6DEDB"/><text x="60" y="782" font-size="15" fill="#172B2A" >1  One clear purpose per card; no claims of guaranteed business success.</text><text x="60" y="809" font-size="15" fill="#172B2A" >2  Cards stack on phones;48 px actions and persistent language/help route.</text><text x="60" y="836" font-size="15" fill="#172B2A" >3  Free platform: no checkout, payment request or purchase commitment.</text></svg>
